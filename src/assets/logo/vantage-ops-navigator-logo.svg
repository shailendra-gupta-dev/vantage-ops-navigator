<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 160" width="100%" height="100%">
  <defs>
    <linearGradient id="needleGrad" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#4F46E5" />
      <stop offset="100%" stop-color="#06B6D4" />
    </linearGradient>
    <linearGradient id="needleDarkGrad" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#312E81" />
      <stop offset="100%" stop-color="#4F46E5" />
    </linearGradient>
    <linearGradient id="gaugeGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#06B6D4" stop-opacity="0.8"/>
      <stop offset="60%" stop-color="#4F46E5" stop-opacity="0.3"/>
      <stop offset="100%" stop-color="#0F172A" stop-opacity="0"/>
    </linearGradient>
    
    <filter id="neonGlow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="6" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
    <filter id="subtleGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>

  <style>
    .brand-title { font-family: 'Inter', 'SF Pro Display', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; font-weight: 800; font-size: 28px; fill: #FFFFFF; letter-spacing: 1.5px; }
    .brand-subtitle { font-family: 'Inter', 'SF Pro Text', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; font-weight: 500; font-size: 16px; fill: #94A3B8; letter-spacing: 4px; }
    .gauge-tick { stroke: #475569; stroke-width: 1.5; stroke-linecap: round; }
    .gauge-tick-active { stroke: #06B6D4; stroke-width: 2.2; stroke-linecap: round; }
  </style>

  <rect width="100%" height="100%" fill="#0F172A"/>

  <g transform="translate(20, 0)">
    <circle cx="90" cy="80" r="54" fill="none" stroke="url(#gaugeGrad)" stroke-width="3" stroke-dasharray="180 80" transform="rotate(-45 90 80)" filter="url(#subtleGlow)"/>
    <circle cx="90" cy="80" r="46" fill="none" stroke="#334155" stroke-width="1" stroke-dasharray="4 6" />

    <line x1="90" y1="20" x2="90" y2="25" class="gauge-tick" />
    <line x1="90" y1="20" x2="90" y2="25" class="gauge-tick" transform="rotate(30 90 80)" />
    <line x1="90" y1="20" x2="90" y2="25" class="gauge-tick" transform="rotate(60 90 80)" />
    <line x1="90" y1="20" x2="90" y2="25" class="gauge-tick" transform="rotate(90 90 80)" />
    <line x1="90" y1="20" x2="90" y2="25" class="gauge-tick" transform="rotate(120 90 80)" />
    <line x1="90" y1="20" x2="90" y2="25" class="gauge-tick" transform="rotate(150 90 80)" />
    <line x1="90" y1="20" x2="90" y2="25" class="gauge-tick" transform="rotate(180 90 80)" />
    <line x1="90" y1="20" x2="90" y2="25" class="gauge-tick" transform="rotate(-30 90 80)" />
    <line x1="90" y1="20" x2="90" y2="25" class="gauge-tick" transform="rotate(-60 90 80)" />
    
    <line x1="90" y1="20" x2="90" y2="27" class="gauge-tick-active" transform="rotate(-90 90 80)" filter="url(#subtleGlow)" />
    <line x1="90" y1="20" x2="90" y2="27" class="gauge-tick-active" transform="rotate(-120 90 80)" filter="url(#subtleGlow)" />
    <line x1="90" y1="20" x2="90" y2="27" class="gauge-tick-active" transform="rotate(-150 90 80)" filter="url(#subtleGlow)" />

    <g transform="rotate(35 90 80)" filter="url(#neonGlow)">
      <path d="M90 22 L104 80 L90 73 Z" fill="url(#needleGrad)" />
      <path d="M90 22 L76 80 L90 73 Z" fill="url(#needleDarkGrad)" opacity="0.9" />
      <path d="M90 138 L97 87 L90 92 Z" fill="#4F46E5" opacity="0.4" />
      <path d="M90 138 L83 87 L90 92 Z" fill="#312E81" opacity="0.4" />
    </g>

    <circle cx="90" cy="80" r="5" fill="#0F172A" stroke="#06B6D4" stroke-width="2.5" />
  </g>

  <g transform="translate(185, 74)">
    <text x="0" y="0" class="brand-title">VANTAGE <tspan fill="#06B6D4">OPS</tspan></text>
    <text x="0" y="25" class="brand-subtitle">NAVIGATOR</text>
  </g>
</svg>