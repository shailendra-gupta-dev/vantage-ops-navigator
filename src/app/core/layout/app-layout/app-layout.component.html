<div class="app-layout">

  <!-- ── Sidebar ─────────────────────────────────────────────────────────── -->
  <!-- Drawer closes via its X button, Esc, the scrim, or activating a nav link -->
  <app-sidebar
    [currentRole]="currentRole()"
    [navConfig]="navConfig()"
    [profile]="profile()"
    [open]="navOpen()"
    (closed)="navOpen.set(false)"
  />

  <!-- Scrim behind the open drawer (below 1024px) -->
  <div class="app-layout__scrim"
       [class.app-layout__scrim--visible]="navOpen()"
       (click)="navOpen.set(false)"
       aria-hidden="true"></div>

  <!-- ── Main column ────────────────────────────────────────────────────── -->
  <div class="app-layout__main">

    <app-header
      [currentRole]="currentRole()"
      [profile]="profile()"
      [pageTitle]="pageTitle()"
      (roleChange)="currentRole.set($event)"
      (searchOpen)="searchOpen.set(true)"
      (menuToggle)="navOpen.set(!navOpen())"
    />

    <app-contract-pulse-strip />

    <main class="app-layout__content" role="main">
      <router-outlet />
    </main>

    <app-footer />

  </div>

  <!-- Spotlight overlay — outside .app-layout__main so fixed covers full viewport -->
  <app-spotlight-search
    [isOpen]="searchOpen()"
    (closed)="searchOpen.set(false)"
  />

</div>
