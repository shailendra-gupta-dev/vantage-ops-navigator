<div class="app-layout">

  <a class="skip-link" href="#main-content" (click)="skipToMain($event)">Skip to main content</a>

  <!-- ── Sidebar ─────────────────────────────────────────────────────────── -->
  <!-- Drawer closes via its X button, Esc, the scrim, or activating a nav link -->
  <app-sidebar
    [currentRole]="currentRole()"
    [navConfig]="navConfig()"
    [profile]="profile()"
    [open]="navOpen()"
    [modal]="drawerMode()"
    (closed)="closeNav()"
    (navigated)="closeNav(false)"
    (roleChange)="currentRole.set($event)"
  />

  <!-- Scrim behind the open drawer (below 1024px) -->
  <div class="app-layout__scrim"
       [class.app-layout__scrim--visible]="navOpen()"
       (click)="closeNav()"
       aria-hidden="true"></div>

  <!-- ── Main column ────────────────────────────────────────────────────── -->
  <div class="app-layout__main">

    <app-header
      [currentRole]="currentRole()"
      [profile]="profile()"
      [pageTitle]="pageTitle()"
      [menuOpen]="navOpen()"
      (roleChange)="currentRole.set($event)"
      (searchOpen)="searchOpen.set(true)"
      (menuToggle)="navOpen.set(!navOpen())"
    />

    <app-contract-pulse-strip />

    <!-- tabindex="0": the content area scrolls (≥1024px), so it must be keyboard-focusable
         (axe scrollable-region-focusable); it is also the skip link / route-change focus target. -->
    <main #main id="main-content" class="app-layout__content" [attr.tabindex]="drawerMode() ? -1 : 0">
      <router-outlet />
    </main>

    <app-footer />

  </div>

  <!-- Spotlight overlay — outside .app-layout__main so fixed covers full viewport -->
  <app-spotlight-search
    [isOpen]="searchOpen()"
    (closed)="searchOpen.set(false)"
  />

</div>
