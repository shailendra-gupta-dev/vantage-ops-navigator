<div class="role-switcher">

  <!-- Name = "Role: Engineer": the visible text ("Engineer") is part of the accessible name (WCAG 2.5.3) -->
  <button #trigger class="role-switcher__trigger" (click)="toggle()" (keydown)="onTriggerKeydown($event)" type="button"
          [attr.aria-expanded]="isOpen()" aria-haspopup="listbox"
          [attr.aria-controls]="isOpen() ? uid + '-listbox' : null">
    <span class="role-switcher__dot" aria-hidden="true"></span>
    <span class="sr-only">Role:</span>
    <span class="role-switcher__label">{{ selectedRole() | titlecase }}</span>
    <span class="role-switcher__chevron" aria-hidden="true">
      <svg width="10" height="10" viewBox="0 0 10 10" fill="currentColor">
        <path d="M2 3.5L5 6.5L8 3.5" stroke="currentColor" stroke-width="1.5"
              fill="none" stroke-linecap="round" stroke-linejoin="round"/>
      </svg>
    </span>
  </button>

  @if (isOpen()) {
    <ul #listbox class="role-switcher__menu" role="listbox" tabindex="-1"
        [id]="uid + '-listbox'" aria-label="Select role"
        [attr.aria-activedescendant]="optionId(activeIndex())"
        (keydown)="onListKeydown($event)">
      @for (role of roles; track role; let i = $index) {
        <li class="role-switcher__option"
            [id]="optionId(i)"
            [class.role-switcher__option--active]="role === selectedRole()"
            [class.role-switcher__option--highlight]="i === activeIndex()"
            role="option"
            tabindex="-1"
            [attr.aria-selected]="role === selectedRole()"
            (click)="select(role)"
            (keydown.enter)="select(role)"
            (mouseenter)="activeIndex.set(i)">
          <span class="role-switcher__option-label">{{ role | titlecase }}</span>
          @if (role === selectedRole()) {
            <svg class="role-switcher__check" width="12" height="12" viewBox="0 0 12 12"
                 fill="currentColor" aria-hidden="true">
              <path d="M2 6l3 3 5-5" stroke="currentColor" stroke-width="1.5"
                    fill="none" stroke-linecap="round" stroke-linejoin="round"/>
            </svg>
          }
        </li>
      }
    </ul>
  }

</div>
