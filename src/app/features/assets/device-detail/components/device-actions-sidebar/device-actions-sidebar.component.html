<div class="actions-sidebar">

  <!-- Quick Actions Card -->
  <div class="actions-card">
    <div class="actions-card__header">
      <h2 class="actions-card__title">Quick Actions</h2>
      <svg class="actions-card__chevron" width="12" height="12" viewBox="0 0 12 12" fill="none" aria-hidden="true">
        <path d="M2.5 7.5L6 4L9.5 7.5" stroke="currentColor" stroke-width="1.3" stroke-linecap="round" stroke-linejoin="round"/>
      </svg>
    </div>
    <div class="actions-card__body">
      <button class="actions-btn actions-btn--patch" type="button">
        <img src="assets/icons/wrench-icon.svg" alt="" aria-hidden="true">
        Schedule Patch
      </button>
      <button class="actions-btn actions-btn--ack" type="button">
        <img src="assets/icons/check-circle-icon.svg" alt="" aria-hidden="true">
        Acknowledge All
      </button>
      <button class="actions-btn actions-btn--ghost" type="button">
        <img src="assets/icons/headset-icon.svg" alt="" aria-hidden="true">
        Open Support Case
      </button>
      <button class="actions-btn actions-btn--ghost" type="button">
        <img src="assets/icons/ticket-icon.svg" alt="" aria-hidden="true">
        Create ITSM Ticket
      </button>
      <button class="actions-btn actions-btn--ghost" type="button">
        <img src="assets/icons/terminal-icon.svg" alt="" aria-hidden="true">
        Run Diagnostic
      </button>
      <button class="actions-btn actions-btn--ghost" type="button">
        <img src="assets/icons/ssh-icon.svg" alt="" aria-hidden="true">
        SSH / Console
      </button>
    </div>
  </div>

  <!-- Related Contracts Card -->
  <div class="actions-card">
    <div class="actions-card__header">
      <h2 class="actions-card__title">Related Contracts</h2>
    </div>
    <div class="actions-card__body actions-card__body--list">
      <ul class="actions-list">
        @for (contract of relatedContracts(); track contract.id) {
          <li class="actions-list__row">
            <span class="actions-list__label actions-list__label--mono">{{ contract.id }}</span>
            <div class="actions-list__right">
              <span class="actions-list__dot actions-list__dot--{{ contract.urgency }}"></span>
              <span class="actions-list__days actions-list__days--{{ contract.urgency }}">{{ contract.daysRemaining }}d</span>
            </div>
          </li>
        }
      </ul>
    </div>
  </div>

  <!-- Related Devices Card -->
  <div class="actions-card">
    <div class="actions-card__header">
      <h2 class="actions-card__title">Related Devices</h2>
    </div>
    <div class="actions-card__body actions-card__body--list">
      <ul class="actions-list">
        @for (rel of relatedDevices(); track rel.id) {
          <li class="actions-list__row">
            <span class="actions-list__dot actions-list__dot--{{ rel.healthStatus }}"></span>
            <a class="actions-list__device-name" [routerLink]="['/assets/devices', rel.id]">{{ rel.name }}</a>
          </li>
        }
      </ul>
      <a class="actions-card__view-all" routerLink="/assets">View all →</a>
    </div>
  </div>

</div>
