<!-- Left panel: Network Health Radar -->
<div class="assessments-page__chart-panel">
  <div class="assessments-page__chart-header">
    <span class="assessments-page__chart-title">Network Health Radar</span>
    <span class="assessments-page__chart-subtitle">5 dimensions</span>
  </div>
  @defer (on idle) {
    <div echarts class="assessments-page__chart" [options]="chartOpt()"></div>
  } @placeholder {
    <div class="assessments-page__chart"></div>
  }
</div>
