name: CI

# Unit tests + production build for every pull request into master. The Pages
# deploy workflow (deploy.yml) publishes after merge; this catches failing tests,
# broken builds and component-style budget errors before they reach master.
on:
  pull_request:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 26

      - name: Install dependencies
        run: npm install

      - name: Unit tests
        run: npx ng test --watch=false

      - name: Build (production, GitHub Pages base href)
        run: npx ng build --configuration production --base-href /vantage-ops-navigator/
